[package]
name = "screnyx"
version = "0.0.1"
edition = "2024"

[dependencies]
embedded-graphics = "0.8.2"
panic-halt = "1.0.0"
serde = {version = "1.0.229", default-features = false, features = ["derive"]}
serde-json-core = "0.6.0"
heapless = "0.9.3"
embedded-hal-nb = "1.0"
embedded-hal = "1.0.0"
esp-hal = { version = "1.2.2", features = ["esp32s3", "unstable"] }
esp-bootloader-esp-idf = { version = "0.6.0", features = ["esp32s3"] }
esp-println = { version = "0.18.0", default-features = false, features = ["esp32s3", "uart", "critical-section"] }

[profile.release]
panic = "abort"

[profile.dev]
panic = "abort"
